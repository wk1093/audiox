name: Deploy AudioX Site and Docs

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'web/public/**'
      - 'docs/**'
      - 'tools/release/mirror-updates.sh'
      - 'tools/release/stage-site.sh'
      - 'web/embedded/**'
      - 'assets/branding/**'
      - '.github/workflows/update-site.yml'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy site, docs, live demo, and update mirror
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: audiox-update-mirror
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout site, docs, and mirror tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            tools/release
            assets/branding
            web
            docs
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            docs/package-lock.json
            web/embedded/package-lock.json

      - name: Build site, VitePress documentation, and Live Demo
        run: bash tools/release/stage-site.sh out/update-pages

      - name: Prepare latest stable and nightly update archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash tools/release/mirror-updates.sh out/update-pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/update-pages

      - name: Deploy update mirror
        id: deployment
        uses: actions/deploy-pages@v4
