<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>audiox web</title>
  <style>
    :root {
      --bg0: #091019;
      --bg1: #102130;
      --card: rgba(14, 27, 38, 0.84);
      --border: #28465a;
      --fg: #e6f2ff;
      --muted: #95afc3;
      --ok: #6fdaa0;
      --warn: #ff9f84;
      --line: #7ac8ff;
      --line-hot: #ffc684;
      --accent: #5fb2ff;
      --accent2: #92d46e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "IBM Plex Sans", "DejaVu Sans", sans-serif;
      color: var(--fg);
      background:
        radial-gradient(1000px 460px at 0% 0%, #163447 0%, transparent 58%),
        radial-gradient(920px 540px at 100% 100%, #142433 0%, transparent 60%),
        linear-gradient(138deg, var(--bg0), var(--bg1));
      min-height: 100vh;
    }

    .app {
      width: min(1240px, 96vw);
      margin: 14px auto;
      display: grid;
      gap: 12px;
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      backdrop-filter: blur(2px);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.28);
    }

    .head {
      padding: 11px 14px;
      border-bottom: 1px solid #223f52;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-stack {
      display: grid;
      gap: 4px;
    }

    .logo-img {
      width: 170px;
      max-width: 44vw;
      height: auto;
      display: block;
    }

    .version {
      color: var(--muted);
      font-size: 12px;
      margin-left: 2px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab-btn {
      border: 1px solid #355f79;
      border-radius: 9px;
      background: #133246;
      color: var(--fg);
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
    }

    .tab-btn.active {
      border-color: #6ca1be;
      background: #1b4258;
      box-shadow: 0 0 0 1px rgba(108, 161, 190, 0.3) inset;
    }

    button {
      border: 1px solid #39647d;
      border-radius: 8px;
      background: #143446;
      color: var(--fg);
      padding: 9px 11px;
      font-size: 13px;
      cursor: pointer;
    }

    button.primary {
      border-color: #5f8f5e;
      background: #234329;
      color: #d8ffe2;
    }

    button.warn {
      border-color: #865a4e;
      background: #442921;
      color: #ffd9cf;
    }

    .tab-page {
      display: none;
      padding: 12px;
    }

    .tab-page.active {
      display: block;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      min-height: 1.2em;
      padding: 0 12px 12px;
    }

    .status.ok { color: var(--ok); }
    .status.warn { color: var(--warn); }

    .routing-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 12px;
    }

    .graph-shell {
      border: 1px solid #223f51;
      border-radius: 10px;
      overflow: hidden;
      background:
        linear-gradient(rgba(122, 200, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(122, 200, 255, 0.08) 1px, transparent 1px),
        #0e1a24;
      background-size: 30px 30px;
      position: relative;
    }

    .graph-toolbar {
      border-bottom: 1px solid #234357;
      padding: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      background: rgba(10, 24, 35, 0.75);
    }

    .graph-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .graph-hint {
      color: var(--muted);
      font-size: 12px;
    }

    .graph-wrap {
      position: relative;
      height: min(66vh, 700px);
      overflow: hidden;
      cursor: grab;
    }

    .graph-wrap.panning {
      cursor: grabbing;
    }

    svg#links {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: auto;
    }

    #nodes {
      position: absolute;
      inset: 0;
      padding: 10px;
      transform-origin: 0 0;
    }

    .node {
      position: absolute;
      width: 250px;
      border: 1px solid #3d6880;
      border-radius: 10px;
      background: linear-gradient(180deg, #112535, #0d1d2a);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.26);
    }

    .node .headbar {
      padding: 7px 9px;
      border-bottom: 1px solid #2c4f64;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      cursor: move;
      user-select: none;
    }

    .kind {
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .ports {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 8px;
    }

    .col { display: grid; gap: 5px; }

    .port {
      border: 1px solid #345c73;
      border-radius: 6px;
      padding: 4px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      background: #132735;
      user-select: none;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .port.in { border-color: #2d607f; }
    .port.out { border-color: #5f7c34; }

    .port.active {
      outline: 1px solid #f0c26e;
      box-shadow: 0 0 0 1px rgba(240, 194, 110, 0.35) inset;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 100px;
      flex: 0 0 auto;
    }

    .dot.in { background: #79c2ff; }
    .dot.out { background: #9ad968; }

    .edge-line {
      stroke: var(--line);
      stroke-width: 2.4;
      fill: none;
      stroke-linecap: round;
      pointer-events: none;
      transition: stroke 100ms ease, filter 100ms ease;
    }

    .edge-line.hot {
      stroke: var(--line-hot);
      filter: drop-shadow(0 0 5px rgba(255, 186, 110, 0.95));
    }

    .edge-hit {
      stroke: rgba(255, 255, 255, 0.001);
      stroke-width: 30;
      fill: none;
      stroke-linecap: round;
      pointer-events: stroke;
      cursor: pointer;
    }

    .edge-del-btn {
      fill: #4a2a27;
      stroke: #ffbfad;
      stroke-width: 1.2;
      pointer-events: all;
      cursor: pointer;
      filter: drop-shadow(0 0 4px rgba(255, 161, 130, 0.45));
    }

    .edge-del-label {
      fill: #ffd9cf;
      font-size: 11px;
      font-family: "IBM Plex Sans", "DejaVu Sans", sans-serif;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    .side-card {
      border: 1px solid #264759;
      border-radius: 10px;
      background: #0f1e29;
      padding: 10px;
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .side-card h2 {
      margin: 0;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .edge-list {
      display: grid;
      gap: 5px;
      max-height: 250px;
      overflow: auto;
      font-size: 12px;
    }

    .edge-item {
      border: 1px solid #33576c;
      border-radius: 6px;
      padding: 5px 6px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .cfg-wrap {
      max-width: 700px;
      border: 1px solid #264759;
      border-radius: 10px;
      background: #0f1e29;
      padding: 12px;
    }

    .cfg-row {
      display: grid;
      grid-template-columns: 1fr 110px;
      gap: 10px;
      margin-top: 8px;
      align-items: center;
    }

    .cfg-row label {
      color: var(--muted);
      font-size: 13px;
    }

    input[type="number"],
    input[type="text"],
    input[type="file"] {
      width: 100%;
      border: 1px solid #36566a;
      border-radius: 8px;
      background: #10212c;
      color: var(--fg);
      padding: 7px;
      font-size: 13px;
    }

    .cfg-actions {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .control-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      max-width: 760px;
    }

    .control-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .mock-upload {
      display: grid;
      gap: 10px;
      max-width: 760px;
      border: 1px solid #264759;
      border-radius: 10px;
      background: #0f1e29;
      padding: 12px;
    }

    .muted { color: var(--muted); font-size: 12px; }

    @media (max-width: 1020px) {
      .routing-grid { grid-template-columns: 1fr; }
      .graph-wrap { height: 58vh; }
    }
  </style>
</head>
<body>
  <main class="app panel">
    <header class="head">
      <div class="brand">
        <div class="brand-stack">
          <img class="logo-img" src="/logo.svg" alt="audiox logo" onerror="this.onerror=null;this.src='/logo.png';">
          <div class="version" id="app-version">version unknown</div>
        </div>
      </div>
      <nav class="tabs" id="tabs">
        <button class="tab-btn active" data-tab="routing">Routing</button>
        <button class="tab-btn" data-tab="config">Config</button>
        <button class="tab-btn" data-tab="control">Control/Status</button>
        <button class="tab-btn" data-tab="upload">Soundboard Upload</button>
      </nav>
    </header>

    <section class="tab-page active" data-page="routing">
      <div class="routing-grid">
        <section class="graph-shell">
          <div class="graph-toolbar">
            <div class="graph-actions">
              <button id="btn-route-save" class="primary">Save Routing</button>
              <button id="btn-edge-delete-mode" class="warn">Delete Lines: ON</button>
              <button id="btn-zoom-out">-</button>
              <button id="btn-zoom-reset">100%</button>
              <button id="btn-zoom-in">+</button>
              <span class="graph-hint" id="zoom-label">zoom 100%</span>
            </div>
            <div class="graph-hint">Drag block header to move. Drag empty canvas to pan. Wheel to zoom.</div>
          </div>
          <div class="graph-wrap" id="graph-wrap">
            <svg id="links"></svg>
            <div id="nodes"></div>
          </div>
        </section>

        <aside class="side-card">
          <h2>Routes</h2>
          <div id="edge-list" class="edge-list"></div>
        </aside>
      </div>
    </section>

    <section class="tab-page" data-page="config">
      <div class="cfg-wrap">
        <div class="cfg-row">
          <label for="usb_playback_channels">USB Playback Channels</label>
          <input id="usb_playback_channels" type="number" min="1" max="16" step="1" value="2">
        </div>
        <div class="cfg-row">
          <label for="usb_capture_channels">USB Capture Channels</label>
          <input id="usb_capture_channels" type="number" min="1" max="16" step="1" value="2">
        </div>
        <div class="cfg-row">
          <label for="usb_sample_rate">USB Sample Rate</label>
          <input id="usb_sample_rate" type="number" min="8000" max="192000" step="1" value="44100">
        </div>
        <div class="cfg-row">
          <label for="usb_sample_size">USB Sample Size (bytes)</label>
          <input id="usb_sample_size" type="number" min="1" max="4" step="1" value="2">
        </div>
        <div class="cfg-actions">
          <button id="btn-load">Load Config</button>
          <button id="btn-save">Save Config</button>
          <button id="btn-reload">Reload Config</button>
        </div>
      </div>
    </section>

    <section class="tab-page" data-page="control">
      <div class="control-grid">
        <section class="side-card">
          <h2>Soundboard Triggers</h2>
          <div class="grid2">
            <button data-slot="0">Play Slot 0</button>
            <button data-slot="1">Play Slot 1</button>
            <button data-slot="2">Play Slot 2</button>
            <button data-slot="3">Play Slot 3</button>
          </div>
        </section>
        <section class="side-card">
          <h2>System Status</h2>
          <div class="control-actions">
            <button id="btn-system-sync">Sync Filesystem</button>
            <button id="btn-system-restart" class="warn">Restart Device</button>
            <button id="btn-system-shutdown" class="warn">Shutdown Device</button>
          </div>
        </section>
      </div>
    </section>

    <section class="tab-page" data-page="upload">
      <div class="mock-upload">
        <h2 style="margin:0; font-size:14px; text-transform:uppercase; letter-spacing:.06em;">Soundboard Upload (Mock)</h2>
        <div class="cfg-row" style="margin-top:0;">
          <label for="upload_slot">Target Slot</label>
          <input id="upload_slot" type="number" min="0" max="31" value="0">
        </div>
        <div class="cfg-row" style="grid-template-columns: 1fr;">
          <label for="upload_file">Audio File</label>
          <input id="upload_file" type="file" accept="audio/*">
        </div>
        <div class="grid2" style="grid-template-columns: 1fr 1fr;">
          <button id="btn-upload-mock" class="primary">Upload (Mock)</button>
          <button id="btn-upload-clear">Clear</button>
        </div>
        <div class="muted">This page is UI-only for now. No file transfer is sent.</div>
      </div>
    </section>

    <div id="status" class="status">idle</div>
  </main>

  <script>
    const statusEl = document.getElementById('status');
    const edgeListEl = document.getElementById('edge-list');
    const nodesEl = document.getElementById('nodes');
    const linksEl = document.getElementById('links');
    const graphWrapEl = document.getElementById('graph-wrap');
    const zoomLabelEl = document.getElementById('zoom-label');
    const tabsEl = document.getElementById('tabs');
    const appVersionEl = document.getElementById('app-version');

    const configPath = '/api/rootfs/config.staging.txt';
    const realConfigPath = '/api/rootfs/config.txt';
    const routingPath = '/api/rootfs/routing.txt';

    const state = {
      nodes: [],
      edges: [],
      selectedOut: null,
      positions: {},
      panX: 0,
      panY: 0,
      scale: 1,
      panning: false,
      panStartX: 0,
      panStartY: 0,
      panOriginX: 0,
      panOriginY: 0,
      draggingNode: null,
      dragOffsetX: 0,
      dragOffsetY: 0,
      edgeDeleteEnabled: true,
      activeTab: 'routing',
    };

    function setStatus(text, kind = '') {
      statusEl.textContent = text;
      statusEl.className = `status ${kind}`.trim();
    }

    function setActiveTab(tab) {
      state.activeTab = tab;
      document.querySelectorAll('.tab-btn').forEach((el) => {
        el.classList.toggle('active', el.dataset.tab === tab);
      });
      document.querySelectorAll('.tab-page').forEach((el) => {
        el.classList.toggle('active', el.dataset.page === tab);
      });
      if (tab === 'routing') {
        renderLinks();
      }
    }

    function updateZoomLabel() {
      zoomLabelEl.textContent = `zoom ${Math.round(state.scale * 100)}%`;
      document.getElementById('btn-zoom-reset').textContent = `${Math.round(state.scale * 100)}%`;
    }

    function graphCoordsFromClient(clientX, clientY) {
      const wrapRect = graphWrapEl.getBoundingClientRect();
      return {
        x: (clientX - wrapRect.left - state.panX) / state.scale,
        y: (clientY - wrapRect.top - state.panY) / state.scale,
      };
    }

    function setZoom(nextScale, anchorClientX = null, anchorClientY = null) {
      const oldScale = state.scale;
      const clamped = Math.max(0.35, Math.min(2.8, nextScale));
      if (Math.abs(clamped - oldScale) < 0.0001) {
        return;
      }

      const wrapRect = graphWrapEl.getBoundingClientRect();
      const anchorX = anchorClientX == null ? wrapRect.left + (wrapRect.width * 0.5) : anchorClientX;
      const anchorY = anchorClientY == null ? wrapRect.top + (wrapRect.height * 0.5) : anchorClientY;
      const graphPoint = graphCoordsFromClient(anchorX, anchorY);

      state.scale = clamped;
      state.panX = (anchorX - wrapRect.left) - (graphPoint.x * state.scale);
      state.panY = (anchorY - wrapRect.top) - (graphPoint.y * state.scale);
      applyViewportTransform();
      renderLinks();
      updateZoomLabel();
    }

    function applyViewportTransform() {
      nodesEl.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.scale})`;
    }

    function getConfigFromForm() {
      return {
        usb_playback_channels: Number(document.getElementById('usb_playback_channels').value) || 2,
        usb_capture_channels: Number(document.getElementById('usb_capture_channels').value) || 2,
        usb_sample_rate: Number(document.getElementById('usb_sample_rate').value) || 44100,
        usb_sample_size: Number(document.getElementById('usb_sample_size').value) || 2,
      };
    }

    function setFormFromConfig(cfg) {
      if (!cfg) return;
      document.getElementById('usb_playback_channels').value = String(cfg.usb_playback_channels ?? 2);
      document.getElementById('usb_capture_channels').value = String(cfg.usb_capture_channels ?? 2);
      document.getElementById('usb_sample_rate').value = String(cfg.usb_sample_rate ?? 44100);
      document.getElementById('usb_sample_size').value = String(cfg.usb_sample_size ?? 2);
    }

    function parseConfigText(text) {
      const cfg = {
        usb_playback_channels: 2,
        usb_capture_channels: 2,
        usb_sample_rate: 44100,
        usb_sample_size: 2,
      };

      for (const rawLine of text.split(/\r?\n/)) {
        const line = rawLine.trim();
        if (!line || line.startsWith('#')) continue;
        const eq = line.indexOf('=');
        if (eq < 0) continue;
        const key = line.slice(0, eq).trim();
        const value = Number(line.slice(eq + 1).trim());
        if (Number.isNaN(value)) continue;
        if (key in cfg) cfg[key] = value;
      }
      return cfg;
    }

    function formatConfigText(cfg) {
      return [
        `usb_playback_channels=${cfg.usb_playback_channels}`,
        `usb_capture_channels=${cfg.usb_capture_channels}`,
        `usb_sample_rate=${cfg.usb_sample_rate}`,
        `usb_sample_size=${cfg.usb_sample_size}`,
        ''
      ].join('\n');
    }

    async function loadVersion() {
      try {
        const res = await fetch('/api/version', { method: 'GET' });
        const txt = (await res.text()).trim();
        if (!res.ok || !txt) {
          return;
        }
        appVersionEl.textContent = `version ${txt}`;
      } catch (err) {
      }
    }

    async function loadConfig() {
      setStatus('loading config...');
      try {
        let res = await fetch(configPath, { method: 'GET' });
        let txt = await res.text();
        if (!res.ok) {
          res = await fetch(realConfigPath, { method: 'GET' });
          txt = await res.text();
          if (!res.ok) {
            setStatus(`config load failed: ${res.status} ${txt.trim()}`, 'warn');
            return null;
          }
        }

        const cfg = parseConfigText(txt);
        setFormFromConfig(cfg);
        setStatus('config loaded', 'ok');
        return cfg;
      } catch (err) {
        setStatus(`config load error: ${err}`, 'warn');
        return null;
      }
    }

    async function saveConfig() {
      const cfg = getConfigFromForm();
      const payload = formatConfigText(cfg);
      setStatus('saving config...');

      try {
        const res = await fetch(configPath, {
          method: 'PUT',
          headers: { 'Content-Type': 'text/plain' },
          body: payload,
        });
        const txt = await res.text();
        if (!res.ok) {
          setStatus(`config save failed: ${res.status} ${txt.trim()}`, 'warn');
          return false;
        }

        setStatus('config saved', 'ok');
        return true;
      } catch (err) {
        setStatus(`config save error: ${err}`, 'warn');
        return false;
      }
    }

    async function reloadConfig() {
      setStatus('reloading config...');
      try {
        const res = await fetch('/api/config/reload', { method: 'POST' });
        const txt = await res.text();
        if (!res.ok) {
          setStatus(`reload failed: ${res.status} ${txt.trim()}`, 'warn');
          return false;
        }

        setStatus(txt.trim() || 'config reloaded', 'ok');
        return true;
      } catch (err) {
        setStatus(`reload error: ${err}`, 'warn');
        return false;
      }
    }

    async function reloadRoutingFast() {
      try {
        const res = await fetch('/api/routing/reload', { method: 'POST' });
        const txt = await res.text();
        if (!res.ok) {
          setStatus(`routing reload failed: ${res.status} ${txt.trim()}`, 'warn');
          return false;
        }
        return true;
      } catch (err) {
        setStatus(`routing reload error: ${err}`, 'warn');
        return false;
      }
    }

    async function triggerSlot(slot) {
      setStatus(`triggering slot ${slot}...`);
      try {
        const res = await fetch(`/api/soundboard/trigger/${slot}`, { method: 'POST' });
        const txt = await res.text();
        if (!res.ok) {
          setStatus(`error: ${res.status} ${txt.trim()}`, 'warn');
          return;
        }
        setStatus(txt.trim() || `triggered slot ${slot}`, 'ok');
      } catch (err) {
        setStatus(`request failed: ${err}`, 'warn');
      }
    }

    async function runSystemAction(path, label) {
      setStatus(`${label}...`);
      try {
        const res = await fetch(path, { method: 'POST' });
        const txt = (await res.text()).trim();
        if (!res.ok) {
          setStatus(`${label} failed: ${res.status} ${txt}`, 'warn');
          return false;
        }
        setStatus(txt || `${label} ok`, 'ok');
        return true;
      } catch (err) {
        setStatus(`${label} error: ${err}`, 'warn');
        return false;
      }
    }

    function buildNodesFromConfig(cfg) {
      const playback = Math.max(1, Math.min(16, Number(cfg.usb_playback_channels || 2)));
      const capture = Math.max(1, Math.min(16, Number(cfg.usb_capture_channels || 2)));
      state.nodes = [
        { id: 'usb_mic_in', label: 'USB Mic In', kind: 'input', channels: capture },
        { id: 'soundboard_out', label: 'Soundboard Out', kind: 'virtual', channels: 2 },
        { id: 'fx_slot_0', label: 'FX Slot 0', kind: 'effect', channels: 2 },
        { id: 'usb_gadget_out', label: 'USB Gadget Out', kind: 'output', channels: playback },
        { id: 'soundboard_virtual_out', label: 'Soundboard Virtual Out', kind: 'virtual', channels: 2 },
      ];

      state.positions = {
        usb_mic_in: { x: 20, y: 20 },
        soundboard_out: { x: 20, y: 250 },
        fx_slot_0: { x: 330, y: 140 },
        usb_gadget_out: { x: 650, y: 20 },
        soundboard_virtual_out: { x: 650, y: 250 },
      };

      state.panX = 0;
      state.panY = 0;
      state.scale = 1;
      applyViewportTransform();
      updateZoomLabel();
    }

    function clearOutputSelection() {
      state.selectedOut = null;
      document.querySelectorAll('.port.out').forEach((el) => el.classList.remove('active'));
    }

    function edgeKey(edge) {
      return `${edge.src}|${edge.dst}|${edge.srcChannel}|${edge.dstChannel}`;
    }

    function hasEdge(edge) {
      const key = edgeKey(edge);
      return state.edges.some((e) => edgeKey(e) === key);
    }

    function findEdgeIndex(edge) {
      const key = edgeKey(edge);
      return state.edges.findIndex((e) => edgeKey(e) === key);
    }

    function addEdge(edge) {
      const existingIdx = findEdgeIndex(edge);
      if (existingIdx >= 0) {
        if (state.edgeDeleteEnabled) {
          removeEdge(existingIdx);
          setStatus('existing route removed', 'ok');
          clearOutputSelection();
          return;
        }
        setStatus('route already exists', 'warn');
        return;
      }
      state.edges.push(edge);
      renderGraph();
      setStatus('route added (not saved yet)', 'ok');
    }

    function removeEdge(index) {
      if (index < 0 || index >= state.edges.length) {
        return;
      }
      state.edges.splice(index, 1);
      renderGraph();
      setStatus('route removed (not saved yet)', 'ok');
    }

    function parseRoutingText(text) {
      const edges = [];
      for (const rawLine of text.split(/\r?\n/)) {
        const line = rawLine.trim();
        if (!line || line.startsWith('#')) continue;
        if (!line.startsWith('edge=')) continue;

        const fields = line.slice(5).split(',').map((s) => s.trim());
        if (fields.length !== 4) continue;

        const srcChannel = Number(fields[2]);
        const dstChannel = Number(fields[3]);
        if (Number.isNaN(srcChannel) || Number.isNaN(dstChannel) || srcChannel < 0 || dstChannel < 0) {
          continue;
        }

        edges.push({
          src: fields[0],
          dst: fields[1],
          srcChannel,
          dstChannel,
        });
      }
      return edges;
    }

    function formatRoutingText() {
      const out = ['# audiox routing v1'];
      for (const edge of state.edges) {
        out.push(`edge=${edge.src},${edge.dst},${edge.srcChannel},${edge.dstChannel}`);
      }
      out.push('');
      return out.join('\n');
    }

    function nodeAcceptsInput(node) {
      return node.kind === 'output' || node.kind === 'effect';
    }

    function nodeProvidesOutput(node) {
      return node.kind !== 'output';
    }

    function portLocator(nodeId, dir, ch) {
      return `[data-port="${nodeId}:${dir}:${ch}"]`;
    }

    function renderEdgesList() {
      edgeListEl.innerHTML = '';
      if (!state.edges.length) {
        edgeListEl.textContent = 'no routes';
        return;
      }

      state.edges.forEach((edge, idx) => {
        const row = document.createElement('div');
        row.className = 'edge-item';

        const txt = document.createElement('div');
        txt.textContent = `${edge.src}[${edge.srcChannel}] -> ${edge.dst}[${edge.dstChannel}]`;

        const btn = document.createElement('button');
        btn.textContent = 'remove';
        btn.addEventListener('click', () => removeEdge(idx));

        row.appendChild(txt);
        row.appendChild(btn);
        edgeListEl.appendChild(row);
      });
    }

    function beginNodeDrag(ev, nodeId) {
      const pos = state.positions[nodeId];
      if (!pos) {
        return;
      }

      const graph = graphCoordsFromClient(ev.clientX, ev.clientY);
      state.draggingNode = nodeId;
      state.dragOffsetX = graph.x - pos.x;
      state.dragOffsetY = graph.y - pos.y;
      ev.preventDefault();
      ev.stopPropagation();
    }

    function moveNodeDrag(ev) {
      if (!state.draggingNode) {
        return false;
      }

      const graph = graphCoordsFromClient(ev.clientX, ev.clientY);
      const nodeId = state.draggingNode;
      state.positions[nodeId] = {
        x: Math.round(graph.x - state.dragOffsetX),
        y: Math.round(graph.y - state.dragOffsetY),
      };

      const nodeEl = nodesEl.querySelector(`.node[data-node-id="${nodeId}"]`);
      if (nodeEl) {
        nodeEl.style.left = `${state.positions[nodeId].x}px`;
        nodeEl.style.top = `${state.positions[nodeId].y}px`;
      }

      renderLinks();
      return true;
    }

    function endNodeDrag() {
      state.draggingNode = null;
    }

    function renderNodes() {
      nodesEl.innerHTML = '';

      for (const node of state.nodes) {
        const wrap = document.createElement('div');
        wrap.className = 'node';
        wrap.dataset.nodeId = node.id;
        const pos = state.positions[node.id] || { x: 20, y: 20 };
        wrap.style.left = `${pos.x}px`;
        wrap.style.top = `${pos.y}px`;

        const head = document.createElement('div');
        head.className = 'headbar';
        head.innerHTML = `<strong>${node.label}</strong><span class="kind">${node.kind}</span>`;
        head.addEventListener('mousedown', (ev) => beginNodeDrag(ev, node.id));

        const ports = document.createElement('div');
        ports.className = 'ports';

        const inCol = document.createElement('div');
        inCol.className = 'col';
        const outCol = document.createElement('div');
        outCol.className = 'col';

        for (let ch = 0; ch < node.channels; ch += 1) {
          if (nodeAcceptsInput(node)) {
            const pin = document.createElement('div');
            pin.className = 'port in';
            pin.dataset.port = `${node.id}:in:${ch}`;
            pin.innerHTML = `<span class="dot in"></span><span>in ${ch + 1}</span>`;
            pin.addEventListener('click', () => {
              if (!state.selectedOut) return;
              addEdge({
                src: state.selectedOut.nodeId,
                dst: node.id,
                srcChannel: state.selectedOut.channel,
                dstChannel: ch,
              });
              clearOutputSelection();
            });
            inCol.appendChild(pin);
          }

          if (nodeProvidesOutput(node)) {
            const pout = document.createElement('div');
            pout.className = 'port out';
            pout.dataset.port = `${node.id}:out:${ch}`;
            pout.innerHTML = `<span>out ${ch + 1}</span><span class="dot out"></span>`;
            pout.addEventListener('click', () => {
              clearOutputSelection();
              state.selectedOut = { nodeId: node.id, channel: ch };
              pout.classList.add('active');
            });
            outCol.appendChild(pout);
          }
        }

        ports.appendChild(inCol);
        ports.appendChild(outCol);
        wrap.appendChild(head);
        wrap.appendChild(ports);
        nodesEl.appendChild(wrap);
      }

      applyViewportTransform();
    }

    function getPortCenter(nodeId, dir, ch) {
      const el = document.querySelector(portLocator(nodeId, dir, ch));
      if (!el) return null;
      const wrapRect = graphWrapEl.getBoundingClientRect();
      const r = el.getBoundingClientRect();
      return {
        x: (r.left - wrapRect.left) + (r.width / 2),
        y: (r.top - wrapRect.top) + (r.height / 2),
      };
    }

    function renderLinks() {
      linksEl.innerHTML = '';

      state.edges.forEach((edge, idx) => {
        const a = getPortCenter(edge.src, 'out', edge.srcChannel);
        const b = getPortCenter(edge.dst, 'in', edge.dstChannel);
        if (!a || !b) return;

        const c = Math.max(60, Math.abs(b.x - a.x) * 0.4);
        const d = `M ${a.x},${a.y} C ${a.x + c},${a.y} ${b.x - c},${b.y} ${b.x},${b.y}`;

        const visual = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        visual.setAttribute('d', d);
        visual.setAttribute('class', 'edge-line');

        const hit = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        hit.setAttribute('d', d);
        hit.setAttribute('class', 'edge-hit');

        const p0x = a.x;
        const p0y = a.y;
        const p1x = a.x + c;
        const p1y = a.y;
        const p2x = b.x - c;
        const p2y = b.y;
        const p3x = b.x;
        const p3y = b.y;
        const t = 0.5;
        const it = 1 - t;
        const midX = (it * it * it * p0x) + (3 * it * it * t * p1x) + (3 * it * t * t * p2x) + (t * t * t * p3x);
        const midY = (it * it * it * p0y) + (3 * it * it * t * p1y) + (3 * it * t * t * p2y) + (t * t * t * p3y);

        const delBtn = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        delBtn.setAttribute('class', 'edge-del-btn');
        delBtn.setAttribute('cx', String(midX));
        delBtn.setAttribute('cy', String(midY));
        delBtn.setAttribute('r', '8');
        delBtn.style.display = state.edgeDeleteEnabled ? 'block' : 'none';

        const delLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        delLabel.setAttribute('class', 'edge-del-label');
        delLabel.setAttribute('x', String(midX));
        delLabel.setAttribute('y', String(midY + 0.5));
        delLabel.textContent = 'x';
        delLabel.style.display = state.edgeDeleteEnabled ? 'block' : 'none';

        hit.addEventListener('mouseenter', () => {
          visual.classList.add('hot');
        });

        hit.addEventListener('mouseleave', () => {
          visual.classList.remove('hot');
        });

        hit.addEventListener('click', () => {
          if (!state.edgeDeleteEnabled) {
            setStatus('line delete is disabled. toggle Delete Lines to ON.', 'warn');
            return;
          }
          removeEdge(idx);
        });

        hit.addEventListener('mousedown', (ev) => {
          ev.preventDefault();
          ev.stopPropagation();
        });

        hit.addEventListener('pointerdown', (ev) => {
          ev.preventDefault();
          ev.stopPropagation();
        });

        delBtn.addEventListener('click', (ev) => {
          ev.preventDefault();
          ev.stopPropagation();
          removeEdge(idx);
        });

        delBtn.addEventListener('mousedown', (ev) => {
          ev.preventDefault();
          ev.stopPropagation();
        });

        delBtn.addEventListener('pointerdown', (ev) => {
          ev.preventDefault();
          ev.stopPropagation();
        });

        linksEl.appendChild(visual);
        linksEl.appendChild(hit);
        linksEl.appendChild(delBtn);
        linksEl.appendChild(delLabel);
      });
    }

    function renderGraph() {
      renderNodes();
      renderEdgesList();
      renderLinks();
    }

    async function loadRoutingFile() {
      setStatus('loading routing...');
      try {
        const res = await fetch(routingPath, { method: 'GET' });
        const txt = await res.text();
        if (!res.ok) {
          state.edges = [];
          renderGraph();
          setStatus('routing file missing, starting empty', 'warn');
          return;
        }

        state.edges = parseRoutingText(txt);
        renderGraph();
        setStatus('routing loaded', 'ok');
      } catch (err) {
        setStatus(`routing load error: ${err}`, 'warn');
      }
    }

    async function saveRouting() {
      setStatus('saving routing...');
      try {
        const res = await fetch(routingPath, {
          method: 'PUT',
          headers: { 'Content-Type': 'text/plain' },
          body: formatRoutingText(),
        });
        const txt = await res.text();
        if (!res.ok) {
          setStatus(`routing save failed: ${res.status} ${txt.trim()}`, 'warn');
          return false;
        }

        const reloaded = await reloadRoutingFast();
        if (!reloaded) {
          return false;
        }

        setStatus('routing saved and reloaded', 'ok');
        return true;
      } catch (err) {
        setStatus(`routing save error: ${err}`, 'warn');
        return false;
      }
    }

    function beginPan(ev) {
      if (ev.button !== 0) {
        return;
      }

      const target = ev.target;
      if (target instanceof Element && (
        target.closest('.node') ||
        target.closest('.edge-hit') ||
        target.closest('.edge-del-btn') ||
        target.closest('.edge-line') ||
        target.closest('button')
      )) {
        return;
      }
      state.panning = true;
      graphWrapEl.classList.add('panning');
      state.panStartX = ev.clientX;
      state.panStartY = ev.clientY;
      state.panOriginX = state.panX;
      state.panOriginY = state.panY;
      ev.preventDefault();
    }

    function movePan(ev) {
      if (moveNodeDrag(ev)) {
        return;
      }
      if (!state.panning) {
        return;
      }
      const dx = ev.clientX - state.panStartX;
      const dy = ev.clientY - state.panStartY;
      state.panX = state.panOriginX + dx;
      state.panY = state.panOriginY + dy;
      applyViewportTransform();
      renderLinks();
    }

    function endPan() {
      endNodeDrag();
      if (!state.panning) {
        return;
      }
      state.panning = false;
      graphWrapEl.classList.remove('panning');
    }

    function onGraphWheel(ev) {
      ev.preventDefault();
      const step = ev.deltaY < 0 ? 1.1 : 0.9;
      setZoom(state.scale * step, ev.clientX, ev.clientY);
    }

    function setEdgeDeleteMode(enabled) {
      state.edgeDeleteEnabled = !!enabled;
      const btn = document.getElementById('btn-edge-delete-mode');
      btn.textContent = `Delete Lines: ${state.edgeDeleteEnabled ? 'ON' : 'OFF'}`;
      btn.classList.toggle('warn', state.edgeDeleteEnabled);
      btn.classList.toggle('primary', !state.edgeDeleteEnabled);
      renderLinks();
    }

    async function initializeGraphFromConfig() {
      const cfg = (await loadConfig()) || getConfigFromForm();
      buildNodesFromConfig(cfg);
      await loadRoutingFile();
      renderGraph();
      updateZoomLabel();
      setEdgeDeleteMode(true);
    }

    tabsEl.querySelectorAll('.tab-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        setActiveTab(btn.dataset.tab);
      });
    });

    document.querySelectorAll('button[data-slot]').forEach((btn) => {
      btn.addEventListener('click', () => triggerSlot(btn.dataset.slot));
    });

    document.getElementById('btn-load').addEventListener('click', async () => {
      const cfg = await loadConfig();
      if (cfg) {
        buildNodesFromConfig(cfg);
        renderGraph();
      }
    });

    document.getElementById('btn-save').addEventListener('click', async () => {
      const ok = await saveConfig();
      if (ok) {
        buildNodesFromConfig(getConfigFromForm());
        await loadRoutingFile();
      }
    });

    document.getElementById('btn-reload').addEventListener('click', async () => {
      const ok = await reloadConfig();
      if (ok) {
        buildNodesFromConfig(getConfigFromForm());
        await loadRoutingFile();
      }
    });

    document.getElementById('btn-route-save').addEventListener('click', saveRouting);

    document.getElementById('btn-edge-delete-mode').addEventListener('click', () => {
      setEdgeDeleteMode(!state.edgeDeleteEnabled);
    });

    document.getElementById('btn-zoom-in').addEventListener('click', () => {
      setZoom(state.scale * 1.15);
    });

    document.getElementById('btn-zoom-out').addEventListener('click', () => {
      setZoom(state.scale * 0.87);
    });

    document.getElementById('btn-zoom-reset').addEventListener('click', () => {
      setZoom(1);
    });

    graphWrapEl.addEventListener('mousedown', beginPan);
    graphWrapEl.addEventListener('wheel', onGraphWheel, { passive: false });
    window.addEventListener('mousemove', movePan);
    window.addEventListener('mouseup', endPan);
    graphWrapEl.addEventListener('mouseleave', endPan);

    window.addEventListener('resize', renderLinks);

    document.getElementById('btn-upload-mock').addEventListener('click', () => {
      const slot = Number(document.getElementById('upload_slot').value || 0);
      const file = document.getElementById('upload_file').files[0];
      if (!file) {
        setStatus('mock upload: pick a file first', 'warn');
        return;
      }
      setStatus(`mock upload ready for slot ${slot}: ${file.name}`, 'ok');
    });

    document.getElementById('btn-upload-clear').addEventListener('click', () => {
      document.getElementById('upload_slot').value = '0';
      document.getElementById('upload_file').value = '';
      setStatus('mock upload form cleared');
    });

    document.getElementById('btn-system-sync').addEventListener('click', async () => {
      await runSystemAction('/api/system/sync', 'sync');
    });

    document.getElementById('btn-system-restart').addEventListener('click', async () => {
      await runSystemAction('/api/system/restart', 'restart');
    });

    document.getElementById('btn-system-shutdown').addEventListener('click', async () => {
      await runSystemAction('/api/system/shutdown', 'shutdown');
    });

    initializeGraphFromConfig();
    loadVersion();
  </script>
</body>
