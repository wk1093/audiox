# AudioX USB network DHCP and DNS (dnsmasq, supervised by the PID 1 watchdog).
# The device address must match CONFIG_DEVICE_IP; the build checks this.

# Serve only the USB NCM gadget. bind-dynamic lets dnsmasq start before usb0
# exists and pick it up once the runtime binds the gadget and configures it.
interface=usb0
bind-dynamic
keep-in-foreground
log-facility=-

# Run as root without looking up users/groups (the binary is static, without NSS).
user=
group=
pid-file=

# Answer only for the device itself; never forward or read host files.
no-resolv
no-hosts
no-poll
domain-needed
bogus-priv
domain=lan
host-record=audiox,audiox.lan,audiox.local,172.31.73.1

# DHCPv4 for the USB host. No router option, so the host's default route and
# internet access are untouched; only DNS and a search domain are offered.
dhcp-range=172.31.73.10,172.31.73.250,255.255.255.0,12h
dhcp-option=option:router
dhcp-option=option:dns-server,172.31.73.1
dhcp-option=option:domain-search,lan
dhcp-authoritative
dhcp-rapid-commit
leasefile-ro
