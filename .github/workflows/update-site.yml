name: Deploy AudioX Site and Docs

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'scripts/mirror-updates.sh'
      - 'web/styles.css'
      - 'logo.svg'
      - 'logo_small.png'
      - '.github/workflows/update-site.yml'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy site, docs, and update mirror
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: audiox-update-mirror
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout site, docs, and mirror tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            scripts
            site
            web
            docs
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build VitePress documentation
        run: |
          npm ci --prefix docs
          npm run docs:build --prefix docs

      - name: Prepare latest stable and nightly update archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/mirror-updates.sh out/update-pages

      - name: Add documentation to Pages artifact
        run: |
          mkdir -p out/update-pages/docs
          cp -R docs/.vitepress/dist/. out/update-pages/docs/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/update-pages

      - name: Deploy update mirror
        id: deployment
        uses: actions/deploy-pages@v4
