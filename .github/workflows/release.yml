name: Release AudioX

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

concurrency:
  group: audiox-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Select release from Makefile version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      channel: ${{ steps.release.outputs.channel }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check version and published releases
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Run this workflow from main to release its selected commit."
            exit 1
          fi
          bash scripts/prepare-release.sh >> "$GITHUB_OUTPUT"

  release:
    name: Build and publish ${{ needs.prepare.outputs.channel }} release
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/c-cpp.yml
    with:
      channel: ${{ needs.prepare.outputs.channel }}
      tag: ${{ needs.prepare.outputs.tag }}
